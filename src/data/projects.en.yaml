开源描述:                       # 开源节各仓库的英文描述（键 = 仓库名）；没写的回退中文/GitHub 原文
  LearnData: An open-source notes template — deploy your own knowledge base and blog in one click.
  img-prompt: A minimalist AI image-prompt generator — 5000+ prompts in 18 languages, write precise prompts in your own tongue.
  md-translator: Translate Markdown without breaking format — code blocks, LaTeX and links all preserved.
  scrcpy-helper: A tiny, no-install Chinese GUI for scrcpy on Windows.
  rime-WeaselServer: A helper that fixes the Rime (Weasel) input method or its service failing to start.
  legend-talk: A multi-round AI roundtable with 161 great thinkers who debate each other, not just answer you.
  native-batch-downloader: Batch-download files through the browser's native channel — even login-protected ones, cookies carried automatically.
  text-splitter: A long-text splitter for AI prompts, doc editing and social posts — three modes, batch ZIP export.
  text-joiner: Merge text columns line by line with a template — batch-build CSV, SQL and JSON, all in-browser.
  text-diff: Offline two-pane text and file diff that highlights every change and pinpoints the first difference.
  novel-processor: One-click cleanup for messy web novels — smart line breaks, chapter reflow, script conversion, ad removal.
  json-translate: Schema-preserving JSON translation for i18n, with JSONPath and key mapping.
  chinese-conversion: Browser-local Simplified ↔ Traditional Chinese and Japanese Shinjitai converter, with an editable protected dictionary.
  365opensource: An open-source experiment — how many projects can one dev plus AI ship in a year?
  idea-hub: A request-collection and showcase site for the 365 Open Source Plan, with a ticket-desk aesthetic.

作品:
  AiShort:
    介绍: A community for managing and sharing AI prompts. 18 UI languages, works offline and on intranets — built for compliance-sensitive institutions.
  Subtitle Translator:
    介绍: Batch subtitle translation that runs in your browser. Handles .srt/.ass/.vtt/.lrc, 120+ languages and 17+ LLM providers. Listed in deepseek-ai's official awesome list.

# ============================================================
# 数据即站点：改这个文件就是改网站。四种区块 type：
#   featured（大卡带图）/ grid（网格墙）/ list（文字列表）/ stats（数据条）
# star 数、头像、og 缩略图由 scripts/fetch-github.mjs 构建时抓取缓存，
# 手动指定的字段永远优先于自动抓取。
# ============================================================

site:
  lang: zh-CN
  url: https://me.newzone.top
  plan: { total: 365, done: 22, label: 本站是第 22 号作品 } # 365 打卡网格；不需要可删除整行
  footer: '本站为 <a href="https://github.com/rockbenben/365opensource" target="_blank" rel="noopener noreferrer" class="hover:underline">365 开源计划</a> #022'
  # theme: { accent: "#c8402e", accent2: "#a33524" }   # 想换强调色就取消注释（默认朱砂红）

profile:
  name: Benson
  title: 独立开发者 · 「365 开源计划」发起人
  intro: 独立打造 AiShort（8.6K+ stars）等开源矩阵，发起「365 开源计划」——一人 + AI，一年 300+ 开源项目的 AI 原生开发实验。
  github: https://github.com/rockbenben   # 用于自动抓 star / 头像；非开发者可删
  eyebrow: Portfolio · 365 Open Source
  # socials 图标行与 CTA 按钮完全重复时不必两者都留；有 X/博客/RSS 等更多渠道时再启用：
  # socials:
  #   - { label: X, url: https://x.com/xxx }
  #   - { label: RSS, url: https://example.com/feed }
  ctas:
    - { label: GitHub, url: https://github.com/rockbenben, primary: true }
    # 简历 PDF 放到 public/resume.pdf 后再取消注释（避免线上 404）：
    # - { label: 下载简历 PDF, url: /resume.pdf }
    - { label: 联系我, url: mailto:qingwhat@gmail.com }

sections:
  - type: stats
    items:
      - { label: GitHub Stars, value: 10000, suffix: "+", auto: total_stars }
      - { label: 开源项目, value: 30, suffix: "+" }
      - { label: 产品支持语言, value: 18, suffix: " 种" }

  - type: featured
    title: 代表作
    hint: 点开即用
    items:
      - repo: ChatGPT-Shortcut
        name: AiShort
        tagline: AI 提示词管理与分享社区
        desc: 18 种界面语言，支持离线使用与内网部署，服务合规敏感的政企与科研机构。
        demo: https://www.aishort.top/
        tags: [提示词, 社区, i18n]
      - repo: subtitle-translator
        name: Subtitle Translator
        tagline: 浏览器本地运行的批量字幕翻译工具
        desc: 支持 .srt/.ass/.vtt/.lrc，120+ 语言与 17+ 家 LLM 服务商，入选 deepseek-ai 官方 awesome 列表。
        demo: https://tools.newzone.top/zh/subtitle-translator
        tags: [翻译, 本地处理, LLM]
      - repo: thousand-lives
        name: 千世书 Thousand Lives
        tagline: AI 文字游戏 · 免 Key 即玩的人生模拟器
        desc: 10 个剧本、61 枚成就，纯前端运行，支持 28 家 AI 服务商预设与自定义剧本。
        demo: https://lives.newzone.top/
        tags: [AI 游戏, 多剧本, 纯前端]


开源描述:                       # 仓库名 → 描述（覆盖 GitHub 原描述）；不写就用 GitHub 原文。英文翻译写在 projects.en.yaml
  LearnData: 开源笔记模板，一键部署个人知识库与博客，收录开源工具、效率方法与心理学自我提升。
  img-prompt: 极简的 AI 绘画提示词生成器，5000+ 提示词、18 种语言，用母语写出精准提示词。
  md-translator: 翻译 Markdown 不破坏格式，代码块、LaTeX 公式、链接全保留。
  scrcpy-helper: 免安装、双击即用的 scrcpy 中文图形界面（Windows）。
  rime-WeaselServer: 小狼毫（Rime）辅助启动工具，解决输入法或算法服务无法正常启动。
  legend-talk: 与 161 位历史思想家的多轮 AI 圆桌——他们彼此辩论，而不只是回答你。
  native-batch-downloader: 通过浏览器原生通道批量下载文件，连需登录的文件也能下，自动携带 Cookie。
  text-splitter: 长文本分割器，面向 AI 提示词、文档编辑与社媒发布，三种模式、批量 ZIP 导出。
  text-joiner: 按模板逐行拼接多列文本，批量生成 CSV、SQL、JSON，全程浏览器本地。
  text-diff: 离线双栏文本 / 文件对比，逐处高亮差异并定位第一处不同，全程浏览器本地。
  novel-processor: 一键修复网络小说排版：智能换行、章节重排、繁简转换、广告清理。
  json-translate: 保结构的 JSON 翻译，面向 i18n，支持 JSONPath 与键映射。
  chinese-conversion: 本地简繁转换与日文新字体互转，自带可编辑保护词典，全程不上传。
  365opensource: 开源实验——一人 + AI，一年能做出多少开源项目？
  idea-hub: 「365 开源计划」的需求收集与项目展示站，工单美学、中英双语。


<!doctype html>
<!--
  onepage 的 social card 模板（1200×630）。定位：一个 YAML，简单就有一个好看的作品页。
  用法：本地 dev 起着时，把本文件另存/软链到 public/ 下，浏览器打开 http://localhost:4321/<该文件> ，
  以 1200×630 截图另存为 public/og.png（字体走站点 /fonts/，保证渲染一致）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Inter"; src: url("/fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Inter"; src: url("/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url("/fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; }

  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; align-items: center; gap: 50px;
    padding: 0 84px;
    background: #fafaf7; color: #1d232e;
    font-family: "Inter", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 左：主张 */
  .pitch { width: 542px; flex-shrink: 0; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 23px;
    letter-spacing: 0.05em; color: #1d232e; }
  h1 { margin-top: 34px; font-size: 66px; line-height: 1.12; font-weight: 700; letter-spacing: -0.015em;
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
  h1 .hl { color: #c8402e; }
  .sub { margin-top: 24px; font-family: "IBM Plex Mono", monospace; font-size: 21px; color: #5d6673; }
  .tags { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 13px 20px; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 18px; color: #5d6673;
    display: flex; align-items: center; gap: 8px; }
  .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #c8402e; flex-shrink: 0; }
  .repo { margin-top: 46px; font-family: "IBM Plex Mono", monospace; font-size: 19px; color: #5d6673; }
  .repo b { color: #1d232e; font-weight: 600; }

  /* 右：真实的 YAML 卡片 = 信号物 */
  .card { position: relative; width: 440px; flex-shrink: 0; background: #fff;
    border: 1px solid #e6e5dc; border-radius: 16px; padding: 32px 38px 38px;
    box-shadow: 0 16px 46px rgba(29,35,46,0.08); }
  .card .bar { display: flex; gap: 9px; margin-bottom: 26px; }
  .card .bar i { width: 12px; height: 12px; border-radius: 50%; background: #edece3; }
  pre { font-family: "IBM Plex Mono", monospace; font-size: 21px; line-height: 1.75; color: #5d6673; white-space: pre; }
  .k { color: #c8402e; }   /* 键：朱砂 */
  .v { color: #1d232e; }   /* 值：墨 */

  /* 朱砂印章 = 唯一签名元素：盖在「你的 YAML」上，寓意资产归你 */
  .stamp { position: absolute; right: 24px; bottom: 22px;
    width: 70px; height: 70px; border: 2.5px solid #c8402e; border-radius: 10px;
    transform: rotate(-6deg); display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace; font-weight: 600; line-height: 1.1; color: #c8402e; }
  .stamp span:first-child { font-size: 19px; letter-spacing: 0.02em; }
  .stamp span:last-child { font-size: 11px; letter-spacing: 0.14em; margin-top: 3px; }
</style>
</head>
<body>
  <div class="pitch">
    <div class="eyebrow">onepage</div>
    <h1>一个 <span class="hl">YAML</span>，<br>就是你的作品页。</h1>
    <div class="sub">Your portfolio page, from a single YAML file.</div>
    <div class="tags">
      <span class="tag">不用写代码</span>
      <span class="tag">免费上线</span>
      <span class="tag">又快又好看</span>
    </div>
    <div class="repo"><b>github.com</b>/rockbenben/onepage</div>
  </div>

  <div class="card">
    <div class="bar"><i></i><i></i><i></i></div>
    <pre><span class="k">名字</span>: <span class="v">你的名字</span>
<span class="k">头衔</span>: <span class="v">你在做什么</span>
<span class="k">链接</span>:
  - <span class="k">GitHub</span>: <span class="v">your-name</span>
<span class="k">数据</span>:
  - <span class="k">GitHub Stars</span>: <span class="v">自动</span>
<span class="k">作品</span>:
  - <span class="k">名字</span>: <span class="v">我的作品</span>
    <span class="k">重点</span>: <span class="v">true</span></pre>
    <div class="stamp"><span>上线</span><span>LIVE</span></div>
  </div>
</body>
</html>

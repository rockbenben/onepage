# push 即部署 + 每周重建（刷新 star 数）
# 构建产物推送到 gh-pages 分支；首次运行后到 Settings → Pages，
# 把 Source 设为「Deploy from a branch」→ 分支 gh-pages、目录 /(root)。
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 23 * * 0" # 每周日 UTC 23:00（北京时间周一早 7 点）刷新 stars
  workflow_dispatch:

permissions:
  contents: write # 需要写权限把构建产物推到 gh-pages 分支

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 供 fetch 脚本提升 GitHub API 限额
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm i
      - name: Validate config
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Build website
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 这是文档部署到的分支名称
          branch: gh-pages
          folder: dist

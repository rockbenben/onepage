project:
  name: onepage
  baseUrl: http://localhost:4321
  outputDir: .design-qa
  appCommand: npx astro preview --port 4321
  appReadyUrl: http://localhost:4321/
  appReadyTimeoutMs: 60000

design:
  designMd: DESIGN.md
  screenSpec: SCREEN_SPEC.md

# 主题/外观由 projects.yaml 决定，构建后落在 <html data-theme data-appearance>。
# 明暗与其他配色在评审时用 CDP 改这两个属性覆盖，不改配置产物。
screens:
  - name: home-desktop
    mode: regression
    app:
      url: /
      viewport: { width: 1440, height: 900 }
      deviceScaleFactor: 1
      fullPage: true
      waitUntil: networkidle
      waitForSelector: body
  - name: home-tablet
    mode: regression
    app:
      url: /
      viewport: { width: 768, height: 1024 }
      fullPage: true
      waitUntil: networkidle
  - name: home-mobile
    mode: regression
    app:
      url: /
      viewport: { width: 390, height: 844 }
      fullPage: true
      waitUntil: networkidle
  - name: home-en
    mode: regression
    app:
      url: /en/
      viewport: { width: 1440, height: 900 }
      fullPage: true
      waitUntil: networkidle
  - name: edit-desktop
    mode: regression
    app:
      url: /edit/
      viewport: { width: 1440, height: 900 }
      fullPage: true
      waitUntil: networkidle
  - name: edit-mobile
    mode: regression
    app:
      url: /edit/
      viewport: { width: 390, height: 844 }
      fullPage: true
      waitUntil: networkidle

uiAlignment:
  runVisualComparison: false
  runComponentAudit: true
  runDebtAudit: true
  runA11yAudit: false
  measurementTolerancePx: 1

code:
  include:
    - src/**/*.{ts,tsx,js,jsx,css,astro,html}
  exclude:
    - node_modules/**
    - dist/**
    - .astro/**
    - .design-qa/**
    - src/data/**

components:
  libraryImportPatterns:
    - "src/edit/inputs"
    - "src/components"
  rawElementPolicy:
    button: prefer-design-system
    input: prefer-design-system
    select: prefer-design-system
    textarea: prefer-design-system
  allowedRawElementFiles:
    - "src/edit/inputs.tsx"
    - "src/styles/global.css"

a11y:
  disabledRules: []
  excludeSelectors:
    - "[data-a11y-ignore]"

debt:
  maxHardCodedColors: 0
  maxArbitraryTailwindValues: 8
  maxInlineStyles: 3
  allowedColorValues:
    - "#000"
    - "#fff"
    - transparent
